<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="338" viewBox="0 0 1280 338" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From seeing to improving: seven stages, four capabilities</title>
<desc id="desc">See, Explain and Anticipate help you see how it really works; Focus and Decide help you know what to do; Create makes it real; Improve keeps it getting better. Enter at any stage, combine methods and revisit earlier stages as new evidence arrives.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#7b909d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="return" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b77b32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif} .step{font-weight:650;fill:#183642}.note{fill:#536b78}.flow{fill:none;stroke:#7b909d;stroke-width:1.6;marker-end:url(#arrow)}.feedback{fill:none;stroke:#b77b32;stroke-width:1.6;stroke-dasharray:5 5;marker-end:url(#return)}</style>
<rect x=".5" y=".5" width="1279" height="337" rx="18" fill="#fafcfd" stroke="#dbe5ea"/>
<text x="38" y="38" font-size="19" font-weight="650" fill="#183642">Seven stages that connect understanding and action</text>
<text x="638" y="69" text-anchor="middle" font-size="14" fill="#98672e">New evidence can send you back to an earlier stage</text>
<path class="feedback" d="M1160 126V84H116V126"/><path class="feedback" d="M290 84V126"/><path class="feedback" d="M464 84V126"/>
<rect x="38" y="126" width="156" height="86" rx="12" fill="#edf5fa" stroke="#3c6c8a" stroke-opacity=".35"/>
<text x="56" y="150" font-size="12" fill="#3c6c8a">01</text><text x="116" y="187" text-anchor="middle" class="step" font-size="22">See</text>
<path class="flow" d="M198 169H208"/>
<rect x="212" y="126" width="156" height="86" rx="12" fill="#edf5fa" stroke="#3c6c8a" stroke-opacity=".35"/>
<text x="230" y="150" font-size="12" fill="#3c6c8a">02</text><text x="290" y="187" text-anchor="middle" class="step" font-size="22">Explain</text>
<path class="flow" d="M372 169H382"/>
<rect x="386" y="126" width="156" height="86" rx="12" fill="#edf5fa" stroke="#3c6c8a" stroke-opacity=".35"/>
<text x="404" y="150" font-size="12" fill="#3c6c8a">03</text><text x="464" y="187" text-anchor="middle" class="step" font-size="22">Anticipate</text>
<path class="flow" d="M546 169H556"/>
<rect x="560" y="126" width="156" height="86" rx="12" fill="#fff5e7" stroke="#a06b2c" stroke-opacity=".35"/>
<text x="578" y="150" font-size="12" fill="#a06b2c">04</text><text x="638" y="187" text-anchor="middle" class="step" font-size="22">Focus</text>
<path class="flow" d="M720 169H730"/>
<rect x="734" y="126" width="156" height="86" rx="12" fill="#fff5e7" stroke="#a06b2c" stroke-opacity=".35"/>
<text x="752" y="150" font-size="12" fill="#a06b2c">05</text><text x="812" y="187" text-anchor="middle" class="step" font-size="22">Decide</text>
<path class="flow" d="M894 169H904"/>
<rect x="908" y="126" width="156" height="86" rx="12" fill="#edf6f0" stroke="#347253" stroke-opacity=".35"/>
<text x="926" y="150" font-size="12" fill="#347253">06</text><text x="986" y="187" text-anchor="middle" class="step" font-size="22">Create</text>
<path class="flow" d="M1068 169H1078"/>
<rect x="1082" y="126" width="156" height="86" rx="12" fill="#f2eff9" stroke="#685c89" stroke-opacity=".35"/>
<text x="1100" y="150" font-size="12" fill="#685c89">07</text><text x="1160" y="187" text-anchor="middle" class="step" font-size="22">Improve</text>
<path d="M38 232V240H542V232" fill="none" stroke="#3c6c8a" stroke-width="1.3"/>
<text x="290" y="275" text-anchor="middle" font-size="18" font-weight="600" fill="#3c6c8a">See how it really works</text>
<path d="M560 232V240H890V232" fill="none" stroke="#a06b2c" stroke-width="1.3"/>
<text x="725" y="275" text-anchor="middle" font-size="18" font-weight="600" fill="#a06b2c">Know what to do</text>
<path d="M908 232V240H1064V232" fill="none" stroke="#347253" stroke-width="1.3"/>
<text x="986" y="275" text-anchor="middle" font-size="18" font-weight="600" fill="#347253">Make it real</text>
<path d="M1082 232V240H1238V232" fill="none" stroke="#685c89" stroke-width="1.3"/>
<text x="1160" y="269" text-anchor="middle" font-size="18" font-weight="600" fill="#685c89">Keep getting</text>
<text x="1160" y="290" text-anchor="middle" font-size="18" font-weight="600" fill="#685c89">better</text>
<text x="38" y="320" class="note" font-size="14">Enter at any stage. Choose and combine methods for your question, and revisit as evidence changes.</text>
</svg>
